<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Form</title>
</head>
<body>
    {% if object %}
        <h2>Edit Book: {{ object.title }}</h2>
    {% else %}  
        <h2>Add New Book</h2> 
    {% endif %}
    <form method="post">
        {% csrf_token %}

        {{ form.as_p}}
        <button type="submit">Save Book</button>
    </form>
</body>
</html>
